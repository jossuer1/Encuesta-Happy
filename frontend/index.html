<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Happy - Tu opinión</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef7f2;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
        margin: 0;
      }
      .card {
        background: #fff;
        max-width: 480px;
        width: 100%;
        padding: 32px;
        border-radius: 14px;
        text-align: center;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      h2 {
        color: #0a7a4f;
        margin-top: 0;
      }
      .paso {
        color: #777;
        font-size: 13px;
        margin: 0;
      }
      .preg {
        font-size: 18px;
        margin: 12px 0 4px;
      }
      .escala {
        color: #777;
        font-size: 13px;
        margin: 0 0 18px;
      }
      .nums {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 24px;
      }
      .num {
        min-width: 44px;
        padding: 10px 0;
        border: 2px solid #0a7a4f;
        border-radius: 22px;
        background: #fff;
        color: #0a7a4f;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      .num.sel {
        background: #0a7a4f;
        color: #fff;
      }
      .main {
        background: #0a7a4f;
        color: #fff;
        border: 0;
        padding: 12px 32px;
        border-radius: 24px;
        font-size: 16px;
        cursor: pointer;
      }
      .main:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h2>Cargando...</h2>
      <p>Un momento por favor, esto puede tardar unos segundos.</p>
    </div>

    <script>
      const API_URL = "https://encuesta-happy.onrender.com";
      const params = new URLSearchParams(location.search);
      const token = params.get("t");
      const qIni = parseInt(params.get("q"));
      const vIni = parseInt(params.get("v"));
      const card = document.getElementById("card");

      const PREGUNTAS = {
        1: {
          texto:
            "En una escala del 1 al 5, ¿qué tan satisfecho/a estás con el servicio de garantía y reparación de pantalla de Happy?",
          escala: "1 = Muy insatisfecho/a | 5 = Muy satisfecho/a",
          min: 1,
          max: 5,
        },
        2: {
          texto:
            "Del 0 al 10, ¿qué tan probable es que recomiendes comprar un celular con Happy a un familiar o amigo?",
          escala: "0 = Nada probable | 10 = Totalmente probable",
          min: 0,
          max: 10,
        },
      };

      const html = (titulo, cuerpo) => {
        card.innerHTML = `<h2>${titulo}</h2>${cuerpo}`;
      };
      const invalido = () =>
        html("Enlace inválido", "<p>Este enlace no es válido.</p>");
      const yaRespondida = () =>
        html(
          "Ya registramos tu respuesta",
          "<p>Gracias, ya respondiste esta encuesta.</p>",
        );
      const gracias = () =>
        html(
          "¡Gracias por tu opinión!",
          "<p>Tus respuestas fueron registradas.</p>",
        );

      async function estado(q) {
        const r = await fetch(
          `${API_URL}/api/estado/${encodeURIComponent(token)}/${q}`,
        );
        if (r.status === 404 || r.status === 400) return null;
        if (!r.ok) throw new Error();
        return (await r.json()).respondida;
      }

      async function init() {
        if (!token) return invalido();
        try {
          const [r1, r2] = await Promise.all([estado(1), estado(2)]);
          if (r1 === null || r2 === null) return invalido();
          if (r1 && r2) return yaRespondida();

          let q = r1 ? 2 : 1; // por defecto, la primera pendiente
          let v = null;
          const P = PREGUNTAS[qIni];
          const enlaceValido = P && vIni >= P.min && vIni <= P.max;
          const yaContestadaEsa = qIni === 1 ? r1 : r2;
          if (enlaceValido && !yaContestadaEsa) {
            q = qIni;
            v = vIni;
          } // viene de un número del correo

          mostrar(q, v, r1 || r2); // "ultima" si ya hay una respondida
        } catch (e) {
          html(
            "Ups",
            "<p>No pudimos conectar. Recarga la página en unos segundos.</p>",
          );
        }
      }

      function mostrar(q, valorInicial, ultima) {
        const P = PREGUNTAS[q];
        let valor = valorInicial;
        let botones = "";
        for (let i = P.min; i <= P.max; i++) {
          botones += `<button class="num${i === valorInicial ? " sel" : ""}" data-v="${i}">${i}</button>`;
        }
        const textoBoton = ultima ? "Enviar" : "Siguiente";

        html(
          "Tu opinión",
          `<p class="paso">${ultima ? "Última pregunta" : `Pregunta ${q} de 2`}</p>
     <p class="preg">${P.texto}</p>
     <p class="escala">${P.escala}</p>
     <div class="nums">${botones}</div>
     <button class="main" id="sig" ${valor === null ? "disabled" : ""}>${textoBoton}</button>`,
        );

        const sig = document.getElementById("sig");
        const nums = card.querySelectorAll(".num");

        nums.forEach((b) => {
          b.onclick = () => {
            valor = parseInt(b.dataset.v);
            nums.forEach((x) => x.classList.remove("sel"));
            b.classList.add("sel");
            sig.disabled = false;
          };
        });

        sig.onclick = async () => {
          sig.disabled = true;
          sig.textContent = "Enviando...";
          try {
            const r = await fetch(`${API_URL}/api/respuesta`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, q, v: valor }),
            });
            if (!r.ok) throw new Error();
            // guardado o ya respondida: en ambos casos se avanza
            ultima ? gracias() : mostrar(q === 1 ? 2 : 1, null, true);
          } catch (e) {
            sig.disabled = false;
            sig.textContent = textoBoton;
            alert("No se pudo enviar. Intenta de nuevo.");
          }
        };
      }

      init();
    </script>
  </body>
</html>
